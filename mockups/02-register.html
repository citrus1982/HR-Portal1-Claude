<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KerjaMY — Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 font-sans flex items-center justify-center px-4 py-12">

  <div class="w-full max-w-md space-y-6">
    <div class="text-center">
      <a href="01-landing.html" class="inline-flex items-center gap-2 text-2xl font-bold text-blue-600">
        <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        KerjaMY
      </a>
      <p class="mt-2 text-gray-500 text-sm">Malaysia's B40 Hiring Platform</p>
    </div>

    <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-8">
      <h1 class="text-xl font-bold text-gray-900">Create your account</h1>
      <p class="text-sm text-gray-500 mt-1 mb-6">Start finding work or hiring talent today — free</p>

      <div class="grid grid-cols-2 gap-3 mb-5">
        <label id="candidateLabel" class="flex flex-col items-center gap-2 rounded-xl border-2 border-blue-500 bg-blue-50 p-4 cursor-pointer transition" onclick="selectRole('candidate')">
          <input type="radio" name="role" value="CANDIDATE" class="sr-only" checked />
          <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span class="text-sm font-semibold text-gray-800">I'm looking for work</span>
          <span class="text-xs text-gray-500">Candidate</span>
        </label>
        <label id="employerLabel" class="flex flex-col items-center gap-2 rounded-xl border-2 border-gray-200 bg-white p-4 cursor-pointer hover:border-gray-300 transition" onclick="selectRole('employer')">
          <input type="radio" name="role" value="EMPLOYER" class="sr-only" />
          <svg class="h-6 w-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span class="text-sm font-semibold text-gray-800">I'm hiring</span>
          <span class="text-xs text-gray-500">Employer</span>
        </label>
      </div>

      <form class="space-y-4" onsubmit="handleSubmit(event)">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full name</label>
          <input type="text" placeholder="Ahmad bin Ali" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
          <input type="email" placeholder="you@email.com" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone <span class="text-gray-400 font-normal">(optional)</span></label>
          <input type="tel" placeholder="01X-XXXXXXX" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" placeholder="Min. 8 characters" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div id="companyField" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-1">Company name</label>
          <input type="text" placeholder="Your Company Sdn Bhd" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition text-sm mt-2">Create free account</button>
      </form>

      <p class="mt-5 text-center text-sm text-gray-500">Already have an account? <a href="03-login.html" class="font-semibold text-blue-600 hover:underline ml-1">Sign in</a></p>
    </div>

    <p class="text-center text-xs text-gray-400">By registering you agree to our Terms of Service and Privacy Policy.</p>
  </div>

  <script>
    function selectRole(role) {
      const cl = document.getElementById('candidateLabel')
      const el = document.getElementById('employerLabel')
      const cf = document.getElementById('companyField')
      if (role === 'candidate') {
        cl.className = 'flex flex-col items-center gap-2 rounded-xl border-2 border-blue-500 bg-blue-50 p-4 cursor-pointer transition'
        el.className = 'flex flex-col items-center gap-2 rounded-xl border-2 border-gray-200 bg-white p-4 cursor-pointer hover:border-gray-300 transition'
        cf.classList.add('hidden')
      } else {
        el.className = 'flex flex-col items-center gap-2 rounded-xl border-2 border-blue-500 bg-blue-50 p-4 cursor-pointer transition'
        cl.className = 'flex flex-col items-center gap-2 rounded-xl border-2 border-gray-200 bg-white p-4 cursor-pointer hover:border-gray-300 transition'
        cf.classList.remove('hidden')
      }
    }
    function handleSubmit(e) { e.preventDefault(); window.location.href = '04-upload.html' }
  </script>

  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs rounded-full px-4 py-2 flex gap-3 shadow-xl">
    <span class="text-gray-400">Screens:</span>
    <a href="01-landing.html" class="hover:text-blue-400">Landing</a>
    <a href="02-register.html" class="text-blue-400 font-semibold">Register</a>
    <a href="03-login.html" class="hover:text-blue-400">Login</a>
    <a href="04-upload.html" class="hover:text-blue-400">Upload</a>
    <a href="05-review.html" class="hover:text-blue-400">Review</a>
    <a href="06-complete.html" class="hover:text-blue-400">Complete</a>
    <a href="07-profile.html" class="hover:text-blue-400">Profile</a>
    <a href="08-activity.html" class="hover:text-blue-400">Activity</a>
  </div>
</body>
</html>
